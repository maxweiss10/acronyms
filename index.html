<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medical Acronym Decoder</title>
<style>
  body{margin:0;background:#fff;color:#000;font-family:"Arial Narrow",Arial,sans-serif;font-size:17px}
  main{max-width:1000px;margin:0 auto;padding:16px}
  .bar{background:#D9D9D9;font-variant:small-caps;font-weight:bold;padding:4px 8px;margin:0 0 10px}
  .row{display:flex;gap:8px;margin-bottom:8px}
  input,select{font:inherit;font-size:17px;padding:8px;border:1px solid #000;border-radius:0;background:#fff;color:#000}
  #q{flex:1;font-size:18px;padding:10px}
  #spec{max-width:200px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th{background:#000;color:#fff;text-align:left;padding:4px 8px;font-variant:small-caps}
  td{padding:4px 8px;vertical-align:top;font-size:14px}
  tr:nth-child(even) td{background:#F2F2F2}
  td:first-child{font-weight:bold;white-space:nowrap;width:14%;font-size:13px}
  td.sp{color:#333;font-size:12px;width:20%;white-space:normal}
  #dec{margin-top:12px}
  #dec div{padding:6px 8px;border:1px solid #000;margin-bottom:6px}
  .g{font-size:14px;color:#444}
  #none{display:none;margin-top:12px}
  #count{font-size:14px;color:#444;margin-top:6px}
</style>
</head>
<body>
<main>
<div class="bar">Medical Acronym Decoder</div>
<div class="row">
  <input id="q" type="search" placeholder="Acronym or compound (3VCAD, s/p CABG)…" autofocus autocomplete="off">
  <select id="spec"><option value="">All specialties</option></select>
</div>
<div id="dec"></div>
<div id="count"></div>
<table id="tbl"><thead><tr><th>Acronym</th><th>Meaning</th><th>Specialty</th></tr></thead><tbody id="t"></tbody></table>
<div id="none">No match. <a id="rep" href="#" target="_blank" rel="noopener">Report a missing term</a></div>
</main>
<script src="data.js"></script>
<script>
// ---- parse ----
const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,"");
const ENTRIES=DICT.trim().split("\n").map(l=>l.split("|").map(x=>x.trim())).filter(p=>p.length===3&&p[0]&&p[1]&&p[2]);

// modifiers that only appear inside compounds (not shown as standalone entries)
const PARTS=[
 ["SV","Single-vessel"],["DV","Double-vessel"],["TV","Triple-vessel"],["MV","Multivessel"],
 ["LM","Left main"],["NO","Non-obstructive"],["SEV","Severe"],["MOD","Moderate"],["SIG","Significant"],
 ["SP","Status post"],["CHR","Chronic"],["ACUT","Acute"],["PAR","Paroxysmal"],["PERS","Persistent"],
 ["PERM","Permanent"],["NV","Nonvalvular"],["NI","Nonischemic"],["HX","History of"],["FHX","Family history of"],
 ["HYP","Hypertrophic"],["CONG","Congenital"],["RX","Treatment"],["TX","Treatment"],["DX","Diagnosis"],["SX","Symptoms"]
].map(([a,m])=>({a,m,spec:"Compound modifier"}));

// lexicon: normalized acronym -> [{a,m,spec}]
const LEX={};
const add=(e)=>{const k=norm(e.a); if(!k) return; (LEX[k]=LEX[k]||[]).push(e);};
ENTRIES.forEach(([a,m,s])=>add({a,m,spec:s}));
PARTS.forEach(add);
add({a:"MVCAD",m:"Multivessel coronary artery disease",spec:"Cardiology"});
add({a:"SVCAD",m:"Single-vessel coronary artery disease",spec:"Cardiology"});
add({a:"DVCAD",m:"Double-vessel coronary artery disease",spec:"Cardiology"});
add({a:"TVCAD",m:"Triple-vessel coronary artery disease",spec:"Cardiology"});
add({a:"LMCAD",m:"Left main coronary artery disease",spec:"Cardiology"});
add({a:"MVD",m:"Multivessel disease",spec:"Cardiology"});
for(let n=1;n<=6;n++){
  add({a:n+"VCAD",m:n+"-vessel coronary artery disease",spec:"Cardiology"});
  add({a:n+"VD",m:n+"-vessel disease",spec:"Cardiology"});
}

// ---- dosing schedules: frequency + timing + route + PRN glued together (TIDAC, POQ6HPRN, SQQHS) ----
const SIG={qd:"Once daily",daily:"Daily",bid:"Twice daily",tid:"Three times daily",qid:"Four times daily",
 qod:"Every other day",qow:"Every other week",qohs:"Every other night at bedtime",qbedtime:"At bedtime",qam:"Every morning",qpm:"Every evening",qhs:"At bedtime",hs:"At bedtime",qn:"Every night",
 qwk:"Every week",qweek:"Every week",biw:"Twice weekly",tiw:"Three times weekly",qmo:"Every month",
 ac:"Before meals",pc:"After meals",wm:"With meals",achs:"Before meals and at bedtime",pchs:"After meals and at bedtime",
 qac:"Before each meal",qpc:"After each meal",prn:"As needed",stat:"Immediately",
 po:"By mouth",iv:"Intravenous",ivp:"IV push",ivpb:"IV piggyback",im:"Intramuscular",sq:"Subcutaneous",sc:"Subcutaneous",
 subq:"Subcutaneous",sl:"Sublingual",pr:"Per rectum",top:"Topical",inh:"Inhaled",neb:"Nebulized",td:"Transdermal",ou:"Both eyes"};
const SIG_ROUTE=new Set("po iv ivp ivpb im sq sc subq sl pr top inh neb td ou".split(" "));
function sigAtom(k){
  if(SIG[k]) return SIG[k];
  let m=k.match(/^q(\d{1,2})h$/); if(m) return m[1]==="1"?"Every hour":`Every ${m[1]} hours`;
  m=k.match(/^q(\d)(\d{1,2})h$/); if(m&&+m[1]<+m[2]) return `Every ${m[1]} to ${m[2]} hours`;
  m=k.match(/^q(\d{1,2})(hrs?)?$/); if(m) return m[1]==="1"?"Every hour":`Every ${m[1]} hours`;
  m=k.match(/^q(\d{1,2})(min|d|wks?|mo)$/); if(m) return `Every ${m[1]} ${{min:"minutes",d:"days",wk:"weeks",wks:"weeks",mo:"months"}[m[2]]}`;
  m=k.match(/^x(\d{1,2})(d|days?|wks?|weeks?)$/); if(m) return `For ${m[1]} ${/^w/.test(m[2])?"weeks":"days"}`;
  m=k.match(/^x(\d{1,2})$/); if(m) return m[1]==="1"?"Once":`${m[1]} times`;
  return null;
}
// whole token must split into schedule pieces, at least two, and not only routes
function sigSegment(w){
  const n=w.length, best=Array(n+1).fill(null); best[0]=[];
  for(let i=0;i<n;i++){ if(!best[i]) continue;
    for(let j=i+1;j<=Math.min(n,i+8);j++){ const k=w.slice(i,j);
      if(sigAtom(k)&&(!best[j]||best[i].length+1<best[j].length)) best[j]=best[i].concat(k); } }
  const p=best[n];
  return p&&p.length>1&&p.some(k=>!SIG_ROUTE.has(k))?p.map(k=>({k,e:{m:sigAtom(k)}})):null;
}

// ---- numbered note patterns: spine levels, cranial nerves, G/P, hospital days, ECG leads, x3, D5 ----
// Notes are full of these and no list can spell out every number, so they are read by rule.
const ROMAN={i:1,ii:2,iii:3,iv:4,v:5,vi:6,vii:7,viii:8,ix:9,x:10,xi:11,xii:12};
const ORD=n=>n+(n%100>=11&&n%100<=13?"th":["th","st","nd","rd"][n%10]||"th");
const SPINE={c:["cervical",8],t:["thoracic",12],l:["lumbar",5],s:["sacral",5]};
const DAYS={hd:"Hospital day",pod:"Postoperative day",ppd:"Postpartum day",dol:"Day of life",ptd:"Post-transplant day",icud:"ICU day",abxd:"Antibiotic day"};
function pattern(tok){
  const w=tok.toLowerCase().replace(/[#\s.]/g,""); let m;
  if((m=w.match(/^([ctls])(\d{1,2})(?:-([ctls])?(\d{1,2}))?$/))){
    const a=SPINE[m[1]], n=+m[2]; if(n<1||n>a[1]) return null;
    if(!m[4]) return `${ORD(n)} ${a[0]} vertebra or nerve root (${m[1].toUpperCase()}${n})`;
    const b=SPINE[m[3]||m[1]], n2=+m[4]; if(n2<1||n2>b[1]) return null;
    return `${m[1].toUpperCase()}${n} to ${(m[3]||m[1]).toUpperCase()}${n2} spinal level`; }
  if((m=w.match(/^(?:cn|cranialnerves?)?([ivx]+|\d{1,2})(?:-([ivx]+|\d{1,2}))?$/))&&(w.startsWith("c")||(/^[ivx]+$/.test(m[1])&&(m[2]||!["i","iv","v","x"].includes(m[1]))))){
    const v=x=>ROMAN[x]||(/^\d+$/.test(x)?+x:0), a=v(m[1]), b=m[2]?v(m[2]):0;
    if(!a||a>12||(m[2]&&(!b||b>12||b<=a))) return null;
    if(!w.startsWith("c")&&!m[2]) return `Roman numeral ${a} (in an exam, cranial nerve ${a})`;
    return b?`Cranial nerves ${a} through ${b}`:`Cranial nerve ${a}`; }
  if((m=w.match(/^g(\d{1,2})p(?:\(?(\d)(\d)(\d)(\d)\)?|(\d{1,2}))$/)))
    return m[6]!==undefined?`Gravida ${m[1]}, para ${m[6]}`:`Gravida ${m[1]}, para ${+m[2]+ +m[3]} (TPAL: ${m[2]} term, ${m[3]} preterm, ${m[4]} abortions or miscarriages, ${m[5]} living)`;
  if((m=w.match(/^g(\d{1,2})$/))) return `Gravida ${m[1]} (${m[1]} pregnanc${m[1]==="1"?"y":"ies"})`;
  if((m=w.match(/^(hd|pod|ppd|dol|ptd|icud|abxd)(\d{1,3})$/))) return `${DAYS[m[1]]} ${m[2]}`;
  const RN={i:1,ii:2,iii:3,iv:4,v:5,vi:6};
  if((m=w.match(/^(ckd|nyha|gold|asa|mp|mallampati|ecog|kps|gcs|nihss|mrs|birads|bi-rads|tirads|ti-rads|tr|lirads|li-rads|lr|pirads|pi-rads|killip|hh|tanner|meld|lungrads|fitz)-?(\d{1,3}|vi|v|iv|i{1,3})([abe])?$/))){
    const SC={ckd:"Chronic kidney disease stage",nyha:"NYHA functional class",gold:"GOLD spirometric grade",asa:"ASA physical status class",mp:"Mallampati class",mallampati:"Mallampati class",
      ecog:"ECOG performance status",kps:"Karnofsky performance status",gcs:"Glasgow Coma Scale score",nihss:"NIH Stroke Scale score",mrs:"Modified Rankin Scale score",
      birads:"BI-RADS category","bi-rads":"BI-RADS category",tirads:"TI-RADS level","ti-rads":"TI-RADS level",tr:"TI-RADS level",lirads:"LI-RADS category","li-rads":"LI-RADS category",lr:"LI-RADS category",
      pirads:"PI-RADS score","pi-rads":"PI-RADS score",killip:"Killip class",hh:"Hunt and Hess grade",tanner:"Tanner stage",meld:"MELD score",lungrads:"Lung-RADS category",fitz:"Fitzpatrick skin type"};
    const v=RN[m[2]]||+m[2];
    return `${SC[m[1]]} ${v}${m[3]==="e"?" (emergency)":m[3]||""}`; }
  if((m=w.match(/^(cp|child-?pugh)-?([abc])$/))) return `Child-Pugh class ${m[2].toUpperCase()}`;
  if((m=w.match(/^(yp|yc|p|c|r)?t([0-4]|is|x)([a-d])?n([0-3]|x)([a-c])?(?:m([01]|x)([a-c])?)?$/))){
    const kind={p:"pathologic",c:"clinical",yp:"pathologic after neoadjuvant therapy",yc:"clinical after neoadjuvant therapy",r:"recurrence"}[m[1]];
    return `TNM stage: tumor T${m[2]}${m[3]||""}, nodes N${m[4]}${m[5]||""}${m[6]?`, metastasis M${m[6]}${m[7]||""}`:""}${kind?` (${kind})`:""}`; }
  if((m=w.match(/^(\d{1,2})(?:w|wk|wks)(\d)d?$/))||(m=w.match(/^(\d{1,2})\+(\d)$/))) return `${m[1]} weeks ${m[2]} days gestation`;
  if((m=w.match(/^(\d{1,2}(?:\.\d)?)l(?:pm)?(nc|fm|vm|nrb)$/))) return `${m[1]} liters per minute by ${{nc:"nasal cannula",fm:"face mask",vm:"Venturi mask",nrb:"non-rebreather mask"}[m[2]]}`;
  if((m=w.match(/^hfnc(\d{2})\/(\d{2,3})%?$/))) return `High-flow nasal cannula at ${m[1]} L/min, FiO2 ${m[2]}%`;
  if((m=w.match(/^v([1-6])r?$/))) return `ECG precordial lead V${m[1]}${w.endsWith("r")?" (right-sided)":""}`;
  if((m=w.match(/^(om|d)([1-3])$/))) return `${m[1]==="om"?"Obtuse marginal":"Diagonal"} branch ${m[2]} (coronary artery)`;
  if((m=w.match(/^d(5|10|12\.?5|20|25|50|70)(w|ns|lr|1\/2ns|halfns|0?45ns|0?9ns|1\/4ns)?$/))){
    const sol={w:" in water",ns:" in normal saline",lr:" in lactated Ringer's","1/2ns":" in half-normal saline",halfns:" in half-normal saline","45ns":" in 0.45% saline","045ns":" in 0.45% saline","9ns":" in normal saline","09ns":" in normal saline","1/4ns":" in quarter-normal saline"};
    return `${m[1].replace("125","12.5")}% dextrose${sol[m[2]]||""}`; }
  if(/^q/.test(w)&&sigAtom(w.replace(/[-\/]/g,""))) return sigAtom(w.replace(/[-\/]/g,""));
  if((m=w.match(/^(a&?a?o|aao)x([1-4])$/))) return `Alert and oriented to ${["person","person and place","person, place and time","person, place, time and situation"][m[2]-1]}`;
  if((m=w.match(/^x(\d{1,2})$/))) return `Times ${m[1]} (${m[1]} times, or ${m[1]} occurrences)`;
  if((m=w.match(/^x(\d{1,2})(d|days?|wks?|weeks?|mo|months?|h|hrs?)$/))) return `For ${m[1]} ${/^w/.test(m[2])?"weeks":/^m/.test(m[2])?"months":/^h/.test(m[2])?"hours":"days"}`;
  if((m=w.match(/^(\d)x\/?(d|day|wk|week|mo|month)$/))) return `${m[1]} times per ${/^d/.test(m[2])?"day":/^w/.test(m[2])?"week":"month"}`;
  return null;
}

// ---- glued prefixes: side, segment, acuity, history (LSFA, pLAD, AoCHFrEF, spCABG) ----
// One-letter prefixes only attach to a meaning they can modify: sides to anatomy, acuity to a disease.
const ANAT=/arter|vein|lobe|extremit|quadrant|ventric|atri|kidney|lung|eye|ear\b|knee|hip|shoulder|joint|ligament|nerve|arthroplasty|amputation|hernia|membrane|pulse|bundle|gland|ovar|tube|duct|breast|foot|hand|wrist|ankle|elbow|carotid|femoral|jugular|cerebral|pleura|effusion|pneumothorax|tonsil|catheter|line|drain/i;
const DIS=/disease|failure|injury|syndrome|itis\b|infarct|embol|thromb|hemorrhage|hematoma|pain|rejection|ischemi|fibrillation|insufficiency|anemia|infection|hepatitis|stroke|edema|obstruction|retention|delirium|ulcer|cardiomyopathy|pneumonia|lymphoma|leukemia/i;
// What each history-style prefix usually governs. Used to rank meanings, never to filter:
// s/p wants a procedure (SPLAP = s/p laparoscopic, not left atrial pressure), c/f and r/o a disease.
const PROC=/ectom|otomy|ostomy|plasty|pexy|\btransplant|\breplacement|\brepair|\bbypass|\bgraft|\bcathet|\bresection|\bamputation|\bimplant|\bpacemaker|\bdefibrillator|\bresynchron|\btherapy|scop|\bbiopsy|\bablation|\bshunt|\bstent|\bintervention|\bsurgery|\bsection|\bfusion|\blaparo|\bthoraco|\bcrani|\blamin|\bligation|\bembolization|\bgastrostomy|\btracheostomy|\bdialysis|\bradiation|\bchemo|\bcardioversion|\bclosure|\bclipping|\bcoiling|\benucleation|\bvagotomy|\banastomosis|\bprocedure|\bfixation|\barthroplasty|\breduction|\bdrainage|\bdebridement|\bpancreat|\bERCP|\bdelivery|\bcesarean/i;
const COND=new RegExp(DIS.source+"|tension|lipidemia|diabet|cancer|carcinoma|asthma|apnea|cirrhosis|fracture|abuse|use disorder|dementia|seizure|epilepsy|accident|fibrosis|tumor|malignan|depress|bipolar|schizo|stenosis|aneurysm|dissection|arrhythmi|block|tachycardia","i");
const PREFIX=[["fhx","Family history of",null,COND],["aoc","Acute on chronic",DIS],["sp","Status post",null,PROC],["hx","History of",null,COND],["ho","History of",null,COND],
 ["ro","Rule out",null,COND],["cf","Concern for",null,COND],["rec","Recurrent",DIS],["ae","Acute exacerbation of",DIS],["bl","Bilateral",ANAT],
 ["r","Right",ANAT],["l","Left",ANAT],["b","Bilateral",ANAT],["p","Proximal",ANAT],["m","Mid",ANAT],["d","Distal",ANAT],["a","Acute",DIS],["c","Chronic",DIS]];
// prefixes that stand on their own in a note; only these may take an unknown or multi-piece remainder
const LEAD=new Set(["fhx","sp","hx","ho","ro","cf"]);
function prefixSplit(k){
  for(const [p,pm,re,pref] of PREFIX){ if(!k.startsWith(p)) continue; const rest=k.slice(p.length);
    if(rest.length<2) continue;
    const head={k:p,e:{a:p,m:pm,spec:"Compound modifier"}};
    if(!LEX[rest]){
      if(!LEAD.has(p)||rest.length<3) continue;
      // s/p + LAP + CCY: the remainder splits cleanly inside one field
      // the first piece must fit the prefix (s/p wants a procedure), so s/p CCHO + LE never appears
      const r=segment(rest,e=>e.spec!=="Compound modifier"&&(!pref||pref.test(e.m)));
      if(r&&r.p.length>1) return [head].concat(r.p);
      const b=bestSplit(rest); if(b&&b.sure&&(!pref||pref.test(b.p[0].e.m))) return [head].concat(b.p);
      // s/p + chole: a clipped word is not an acronym; show it as written rather than invent a split
      if(p==="sp"&&/^[a-z]+$/.test(rest)) return [head,{k:rest,e:{a:rest,m:rest+" (written word, not an acronym)",spec:""}}];
      continue; }
    const es=LEX[rest].filter(e=>e.spec!=="Compound modifier"&&(!re||re.test(e.m)));
    // a meaning that names a place (ends in artery, vein, lobe ...) beats one that only mentions it
    const place=e=>re===ANAT&&/(arter(y|ies)|veins?|lobe|extremity|nerve|joint|pulse|membrane|ligament|catheter|line|drain|duct|gland|branch|quadrant)$/i.test(e.m.replace(/\s*\(.*\)$/,""))?1:0;
    const fit=e=>pref&&pref.test(e.m)?1:0;
    if(es.length) return [head,es.sort((x,y)=>fit(y)-fit(x)||place(y)-place(x)||y.spec.split(", ").length-x.spec.split(", ").length)[0]].map((x,i)=>i?{k:rest,e:x}:x); }
  return null;
}

// ---- compound splitting (fewest pieces, longer known pieces preferred) ----
// ok(e) limits which entries may serve as pieces; used to keep every piece in one specialty
function segment(w,ok){
  const n=w.length, best=Array(n+1).fill(null); best[0]={c:0,p:[]};
  for(let i=0;i<n;i++){ if(!best[i]) continue;
    for(let j=i+1;j<=n;j++){
      const k=w.slice(i,j); if(!LEX[k]||k.length<2) continue;
      const es=ok?LEX[k].filter(ok):LEX[k]; if(!es.length) continue;
      const c=best[i].c+1+(k.length<3?0.5:0);
      if(!best[j]||c<best[j].c) best[j]={c,p:best[i].p.concat({k,e:es[0]})};
    } }
  return best[n]||null;
}
// Prefer a split whose pieces all come from one specialty (TID + AC in Pharmacology) over a
// cheaper split stitched from unrelated fields (TI + DAC). Ties go to the more widely used pieces.
const SPECS=[...new Set(ENTRIES.flatMap(e=>e[2].split(", ")))];
const wide=r=>r.p.reduce((s,x)=>s+x.e.spec.split(", ").length,0);
function bestSplit(w){
  let best=null;
  for(const s of SPECS){ const r=segment(w,e=>e.spec==="Compound modifier"||e.spec.split(", ").includes(s));
    if(r&&r.p.length>1&&(!best||r.c<best.c||(r.c===best.c&&wide(r)>wide(best)))) best=r; }
  if(best) return {p:best.p,sure:true};
  const g=segment(w); return g&&g.p.length>1?{p:g.p,sure:false}:null;
}
// tok keeps the user's casing: "pt" (patient) and "PT" (prothrombin time) rank differently
function decodeToken(tok){
  const k=norm(tok), tl=tok.toLowerCase(); if(!k) return null;
  const pm=pattern(tok), pe=pm?[{a:tok,m:pm,spec:"Note pattern"}]:[];
  if(LEX[k]){ const ex=LEX[k].filter(e=>e.a.toLowerCase()===tl);
    const low=tok===tl&&/[a-z]/.test(tl), lc=a=>/[a-z]/.test(a);
    const by=(x,y)=>(y.a===tok)-(x.a===tok)||(low?lc(y.a)-lc(x.a):0)||y.spec.split(", ").length-x.spec.split(", ").length;
    return {t:tok,exact:(ex.length?ex:LEX[k]).slice().sort(by).concat(pe)}; }
  if(pe.length) return {t:tok,exact:pe};
  if(k.length>2&&k.endsWith("s")&&LEX[k.slice(0,-1)]) return decodeToken(tok.slice(0,-1));
  const sig=sigSegment(k);
  if(sig) return {t:tok,seg:sig,why:"dosing schedule"};
  const ps=prefixSplit(k);
  if(ps) return {t:tok,seg:ps,why:"prefix + acronym"};
  const xm=k.match(/^(.+?)x(\d{1,2})$/);
  if(xm&&LEX[xm[1]]) return {t:tok,seg:[{k:xm[1],e:LEX[xm[1]][0]},{k:"x"+xm[2],e:{m:"\u00d7"+xm[2]}}],why:"acronym times N"};
  const b=bestSplit(k);
  if(b) return {t:tok,seg:b.p,why:b.sure?"best guess":"low-confidence guess, pieces from unrelated fields"};
  return {t:tok,none:true};
}

// ---- DOM ----
const $=id=>document.getElementById(id);
const t=$("t"),q=$("q"),none=$("none"),dec=$("dec"),spec=$("spec"),count=$("count");
[...new Set(ENTRIES.flatMap(e=>e[2].split(", ")).concat(["Compound modifier"]))].sort().forEach(s=>{
  const o=document.createElement("option");o.value=s;o.textContent=s;spec.append(o);
});
const SPEC_ABBR={"Cardiology":"Cards","Electrophysiology":"EP","Interventional Cardiology":"Interv","Cardiac Imaging":"Imaging","Heart Failure":"HF","Cardiac Surgery":"CT Surg","Vascular Surgery":"Vasc","Pulmonology":"Pulm","Sleep Medicine":"Sleep","Critical Care":"CC","Nephrology":"Neph","Gastroenterology":"GI","Hepatology":"Hep","Endocrinology":"Endo","Hematology":"Heme","Oncology":"Onc","Transplant":"Transplant","Infectious Disease":"ID","Rheumatology":"Rheum","Allergy & Immunology":"Allergy","Neurology":"Neuro","Neurosurgery":"NSG","Psychiatry":"Psych","Addiction Medicine":"Addiction","Emergency Medicine":"EM","Toxicology":"Tox","Anesthesiology":"Anesth","General Surgery":"Gen Surg","Trauma Surgery":"Trauma","Orthopedics":"Ortho","Sports Medicine":"Sports","Physical Medicine & Rehab":"PM&R","Urology":"Uro","Obstetrics":"OB","Gynecology":"Gyn","Pediatrics":"Peds","Neonatology":"Neo","Genetics":"Genetics","Geriatrics":"Geri","Palliative Care":"Palliative","Pain Medicine":"Pain","Dermatology":"Derm","Plastic Surgery":"Plastics","Ophthalmology":"Ophth","Otolaryngology":"ENT","Dentistry":"Dental","Radiology":"Rad","Pathology":"Path","Laboratory Medicine":"Lab","Pharmacology":"Pharm","Nutrition":"Nutr","Public Health":"PH","Health Administration":"Admin","Hospital Medicine":"Hosp Med","Nursing":"Nursing","Physical Therapy":"PT","Occupational Therapy":"OT","Speech-Language Pathology":"SLP","Respiratory Therapy":"RT","Social Work & Case Management":"SW/CM","Chaplaincy & Spiritual Care":"Chaplain","Health Insurance & Billing":"Insurance","Podiatry":"Podiatry","Orthotics & Prosthetics":"O&P","Evidence-Based Medicine":"EBM","Chart Shorthand":"Chart","Wound & Ostomy Care":"Wound","Perioperative Nursing":"Periop","Dialysis Nursing":"Dialysis RN","EMS & Prehospital":"EMS","Infection Prevention":"IP","Pharmacy Operations":"Pharm Ops","Lab Specimens & Blood Bank":"Lab/BB","Maternal-Newborn Nursing":"L&D/NB","Behavioral Health Unit":"Psych unit","Procedures & Sedation":"Procedures","Compound modifier":"Compound"};
// exact typed forms (keeps slashes/case-folded), so "c/f" is looked up whole instead of split
const RAW=new Set(ENTRIES.map(e=>e[0].toLowerCase()));
// lowercase English glue words in a pasted phrase are not acronyms (OF in caps still decodes)
const WORDS=new Set("of and the to with now on in for at is was but or by from as an if then".split(" "));
const PUN=s=>/[^A-Za-z0-9]/.test(s)?1:0;
const RAWN=new Set(ENTRIES.map(e=>norm(e[0])));
// Fallback for spelling variants (WTD vs W-D, TTP vs TP): index each meaning by its word initials,
// once with every word and once without small linking words.
const STOP=new Set(["of","the","and","to","with","for","in","on","a","an","by","per","or","at"]);
const INIT={};
ENTRIES.forEach(([a,m,sp])=>{const w=m.replace(/\([^)]*\)/g," ").toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
  [w,w.filter(x=>!STOP.has(x))].forEach(ws=>{const k=ws.map(x=>x[0]).join(""); if(k.length>=2&&k!==norm(a)){(INIT[k]=INIT[k]||new Map()).set(a+"|"+m,[a,m,sp]);}});});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function render(){
  const typed=q.value.trim(), raw=typed.toLowerCase(), n=norm(raw), sp=spec.value;
  dec.innerHTML=""; let known=0;

  // decoder: multi-token input, or a single token that is not a whole entry
  if(raw){
    // whole-word lookup first (s/p, c/o, A&Ox3); split on / + & only when the word is not itself an entry
    const toks=q.value.trim().split(/[\s,;]+/).flatMap(w=>RAW.has(w.toLowerCase())||RAWN.has(norm(w))||pattern(w)||!/[\/+&]/.test(w)?[w]:w.split(/[\/+&]+/)).filter(Boolean);
    if((!RAW.has(raw)&&(toks.length>1||!RAWN.has(n)))||(toks.length===1&&pattern(typed))){
      toks.filter(w=>!WORDS.has(w)).map(decodeToken).filter(Boolean).forEach(o=>{
        const d=document.createElement("div"); if(o.exact||o.seg) known++;
        if(o.exact) d.innerHTML=`<b>${esc(o.t)}</b>: ${o.exact.map(e=>esc(e.m)+` <span class="g">(${esc(e.spec)})</span>`).join("; ")}`;
        else if(o.seg) d.innerHTML=`<b>${esc(o.t)}</b>: ${o.seg.map(x=>esc(x.e.m)).join(" + ")} <span class="g">(${o.why}: ${o.seg.map(x=>esc(x.k.toUpperCase())).join(" + ")})</span>`;
        else d.innerHTML=`<b>${esc(o.t)}</b>: <span class="g">not recognized</span>`;
        dec.append(d);
      });
    }
  }

  // table
  let rows=ENTRIES.concat(PARTS.map(p=>[p.a,p.m,p.spec]));
  if(raw&&!n) rows=[];
  else if(raw){
    rows=rows.map(e=>{const na=norm(e[0]);
      let s=9;
      if(e[0].toLowerCase()===raw) s=0; else if(na===n) s=1; else if(na.startsWith(n)) s=2;
      return [s,e];
    }).filter(x=>x[0]<9).sort((x,y)=>x[0]-y[0]||(x[0]===0?(y[1][0]===typed)-(x[1][0]===typed):0)||(x[0]===1&&PUN(raw)?PUN(y[1][0])-PUN(x[1][0]):0)||(x[0]<2?y[1][2].split(", ").length-x[1][2].split(", ").length:0)||x[1][0].localeCompare(y[1][0])).map(x=>x[1]);
  } else rows=sp?rows.slice().sort((x,y)=>x[0].localeCompare(y[0])):[];  // empty box: no list unless a specialty is picked
  if(raw&&!rows.length&&n.length>2&&n.endsWith("s")&&RAWN.has(n.slice(0,-1))){const k=n.slice(0,-1);
    rows=ENTRIES.filter(e=>norm(e[0])===k).sort((x,y)=>y[2].split(", ").length-x[2].split(", ").length).map(([a,m,s])=>[a+"s",m+" (plural)",s]);}
  else if(raw&&!rows.length&&INIT[n]) rows=[...INIT[n].values()].map(([a,m,s])=>[a,m+" (matched by initials)",s]);
  if(sp) rows=rows.filter(e=>e[2].split(", ").includes(sp));

  t.innerHTML="";
  rows.slice(0,400).forEach(([a,m,s])=>{
    const tr=document.createElement("tr");
    [a,m,s].forEach((v,i)=>{const td=document.createElement("td"); if(i===2){td.className="sp"; const full=v.split(", "); const ab=full.map(x=>SPEC_ABBR[x]||x); td.textContent=ab.length>3?ab.slice(0,3).join(", ")+` +${ab.length-3}`:ab.join(", "); td.title=v;} else td.textContent=v; tr.append(td);});
    t.append(tr);
  });
  count.textContent = rows.length>400 ? `Showing 400 of ${rows.length}. Narrow your search.` : (rows.length? `${rows.length} match${rows.length===1?"":"es"}` : "");
  none.style.display=(rows.length||known||!raw)?"none":"block";
  $("tbl").style.display=rows.length?"":"none";
  $("rep").href="https://github.com/maxweiss10/acronyms/issues/new?title="+encodeURIComponent("Missing: "+q.value.trim());
}
// results appear 0.75 s after typing stops; clearing the box clears at once
let timer;
q.addEventListener("input",()=>{clearTimeout(timer); if(!q.value.trim()) render(); else timer=setTimeout(render,750);});
spec.addEventListener("change",render);
render();
</script>
